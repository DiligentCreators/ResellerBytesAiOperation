name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  whmcs-addon-php81:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup WHMCS PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          extensions: curl
          coverage: none

      - name: Validate WHMCS addon PHP 8.1 compatibility
        run: |
          find whmcs-addon/modules/addons/resellerbytes_ai_ops -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php whmcs-addon/tests/credentials_file_test.php
          php whmcs-addon/tests/diagnostic_collector_test.php
          php whmcs-addon/tests/signed_api_client_test.php

  ci:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: redis, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check

  postgres-ai-budget:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql, zip
          coverage: none

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Run AI budget ledger tests against PostgreSQL
        run: |
          DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=testing DB_USERNAME=postgres DB_PASSWORD=postgres vendor/bin/pest tests/Feature/Diagnostics/AiBudgetLedgerTest.php tests/Feature/Diagnostics/AiBudgetReconciliationCommandTest.php tests/Feature/Diagnostics/AnalyzeDiagnosticRunTest.php tests/Feature/Diagnostics/RecoverQueuedDiagnosticsTest.php

      - name: Run multi-process AI budget concurrency test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          AI_DAILY_BUDGET_MICRO_USD: '967432'
          AI_MONTHLY_BUDGET_MICRO_USD: '50000000'
          AI_MAX_INPUT_BYTES: '65536'
          AI_MAX_OUTPUT_TOKENS: '3000'
        run: |
          php artisan migrate:fresh --force
          php tests/Concurrency/ai_budget_reservation.php
